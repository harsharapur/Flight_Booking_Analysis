name: Flight Booking CICD

on:
  push:
    branches:
      - dev
      - main

jobs:
  upload-to-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate to GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Setup Google Cloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Validate that required files exist before uploading
      - name: Validate Required Files
        run: |
          echo "Checking required files..."
          ls -lh airflow_job/airflow_job.py
          ls -lh spark_job/spark_transformation_job.py
          ls -lh variables/dev/variables.json
          echo "All files present ✅"

      # Upload `variables.json` to Composer bucket
      - name: Upload Variables JSON to GCS
        run: |
          COMPOSER_BUCKET=$(gcloud composer environments describe airflow-dev \
            --location us-central1 \
            --format="value(config.dagGcsPrefix)" | sed 's/\/dags//')
          echo "Composer bucket: $COMPOSER_BUCKET"
          gsutil cp variables/dev/variables.json $COMPOSER_BUCKET/data/dev/variables.json

      # Import Variables into Airflow-DEV
      - name: Import Variables into Airflow-DEV
        run: |
          gcloud composer environments run airflow-dev \
            --location us-central1 \
            variables import -- /home/airflow/gcs/data/dev/variables.json

      # Sync Spark job to GCS
      - name: Upload Spark Job to GCS
        run: |
          gsutil cp spark_job/spark_transformation_job.py \
            gs://airflow-projects-dev-hr/flight-booking-analysis/spark-job/spark_transformation_job.py

      # Sync Airflow DAG to Airflow DEV Composer
      - name: Upload Airflow DAG to DEV Environment (Dag Folder)
        run: |
          COMPOSER_BUCKET=$(gcloud composer environments describe airflow-dev \
            --location us-central1 \
            --format="value(config.dagGcsPrefix)" | sed 's/\/dags//')
          echo "Uploading DAG to: $COMPOSER_BUCKET/dags/airflow_job.py"
          gsutil cp airflow_job/airflow_job.py $COMPOSER_BUCKET/dags/airflow_job.py
          echo "Upload complete ✅"

  upload-to-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate to GCP Account
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Setup Google Cloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Validate that required files exist before uploading
      - name: Validate Required Files
        run: |
          echo "Checking required files..."
          ls -lh airflow_job/airflow_job.py
          ls -lh spark_job/spark_transformation_job.py
          ls -lh variables/prod/variables.json
          echo "All files present ✅"

      # Upload `variables.json` to Composer bucket
      - name: Upload Variables JSON to GCS
        run: |
          COMPOSER_BUCKET=$(gcloud composer environments describe airflow-prod \
            --location us-central1 \
            --format="value(config.dagGcsPrefix)" | sed 's/\/dags//')
          echo "Composer bucket: $COMPOSER_BUCKET"
          gsutil cp variables/prod/variables.json $COMPOSER_BUCKET/data/prod/variables.json

      # Import Variables into Airflow-PROD
      - name: Import Variables into Airflow-PROD
        run: |
          gcloud composer environments run airflow-prod \
            --location us-central1 \
            variables import -- /home/airflow/gcs/data/prod/variables.json

      # Sync Spark job to GCS
      - name: Upload Spark Job to GCS
        run: |
          gsutil cp spark_job/spark_transformation_job.py \
            gs://airflow-projects-prod-hr/flight-booking-analysis/spark-job/spark_transformation_job.py

      # Sync Airflow DAG to Airflow PROD Composer
      - name: Upload Airflow DAG to PROD Environment (Dag Folder)
        run: |
          COMPOSER_BUCKET=$(gcloud composer environments describe airflow-prod \
            --location us-central1 \
            --format="value(config.dagGcsPrefix)" | sed 's/\/dags//')
          echo "Uploading DAG to: $COMPOSER_BUCKET/dags/airflow_job.py"
          gsutil cp airflow_job/airflow_job.py $COMPOSER_BUCKET/dags/airflow_job.py
          echo "Upload complete ✅"